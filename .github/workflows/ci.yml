name: CI

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: mvn -B compile

      - name: Tests (avec écran virtuel pour Processing)
        run: xvfb-run --auto-servernum mvn -B test

      - name: Publier les résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

  package-and-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package (jar exécutable)
        run: mvn -B package -DskipTests

      - name: Construire l'arborescence de livraison
        run: |
          TEAM="Groupe 2 - Sonic"
          ROOT="release/$TEAM"

          mkdir -p "$ROOT/Application"
          mkdir -p "$ROOT/Sources"
          mkdir -p "$ROOT/Docs"
          mkdir -p "$ROOT/Files"

          # Application exportée : le jar + les assets
          cp target/*.jar "$ROOT/Application/"
          cp -r data "$ROOT/Application/" 2>/dev/null || true

          # Sources : sketch Processing complet
          cp -r src "$ROOT/Sources/"
          cp pom.xml "$ROOT/Sources/"

          # Docs et Files : ce qui est déjà dans le dépôt (vide pour l'instant)
          cp -r Docs/. "$ROOT/Docs/" 2>/dev/null || true
          cp -r Files/. "$ROOT/Files/" 2>/dev/null || true

          # Nettoyage des .gitkeep pour ne pas les livrer
          find "$ROOT" -name ".gitkeep" -delete

      - name: Publier le livrable
        uses: actions/upload-artifact@v4
        with:
          name: Groupe 2 - Sonic
          path: release/Groupe 2 - Sonic
          retention-days: 90